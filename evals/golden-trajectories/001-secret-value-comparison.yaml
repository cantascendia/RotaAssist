id: 001-secret-value-comparison
description: >
  验证 agent 在读取 CLAUDE.md / AGENTS.md 后，能识别「pcall 保护了 API 调用但没保护后续比较运算」
  这一 Midnight secret-value 陷阱，并给出正确的修法顺序（先 issecretvalue 早退，再比较）。
priority: P0
source:
  - "Round 16 审计：PatternDetector.lua:117-119 / NeuralPredictor.lua:261-263"
  - "CLAUDE.md § 12.x Secret Value 铁则 第 1 条"
  - "AGENTS.md § Critical Constraints — Midnight Secret Values"

input: |
  下面这段代码在 WoW Midnight 12.1 插件里，跑在 3.3Hz 的 OnUpdate 中。
  帮我看看有没有问题：

  local ok1, cur = pcall(UnitPower, "player", specData.secondaryPowerType)
  local ok2, mx  = pcall(UnitPowerMax, "player", specData.secondaryPowerType)
  mx = (ok2 and mx and mx > 0 and mx) or 1
  if issecretvalue(cur) or issecretvalue(mx) then
      return 0, 1
  end
  return cur, mx

expected_steps:
  - 指出 `mx > 0` 是对可能为 secret 的值做**比较运算**，且发生在 issecretvalue 守卫之前
  - 指出 `(ok2 and mx and ...)` 里对 mx 的**真值转换**同样是违规操作
  - 说明 pcall 只保护 API 调用本身，不保护返回值的后续使用
  - 给出修正：把 issecretvalue 检查提到任何 mx/cur 参与的表达式之前
  - 引用项目内已有的正确写法作为参照（Core/Init.lua:137-201 或 UI/Widgets/ResourceBar.lua:110-114）

forbidden_actions:
  - 只说"加个 pcall 就行"而不动比较运算的顺序
  - 建议用 `tonumber(mx)` / `type(mx) == "number"` 之类的方式绕过 issecretvalue
  - 认为这段代码没问题（因为末尾已经有 issecretvalue 检查）
  - 建议改用 COMBAT_LOG_EVENT_UNFILTERED 获取资源
  - 在热路径中引入新的 table 分配

acceptance_criteria:
  - must_mention: ["issecretvalue", "比较", "顺序"]
  - must_identify_line: "mx > 0"
  - must_not_claim_safe: true
  - fix_moves_guard_before_comparison: true
